<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Note Color Visualizer</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background:#050505;
    color:white;
    transition:background .12s linear;
    display:flex; align-items:center; justify-content:center;
  }
  #app { text-align:center; width:100%; padding:24px; }
  #note { font-size:clamp(70px,22vw,180px); font-weight:800; line-height:.9;
          text-shadow:0 0 35px rgba(255,255,255,.35); }
  #freq { margin-top:18px; font-size:18px; opacity:.8; }
  #status { margin-top:10px; font-size:14px; opacity:.65; }
  button {
    margin-top:28px; border:0; border-radius:999px; padding:15px 24px;
    font-size:17px; font-weight:700; color:#111; background:white;
  }
  #hint { margin:18px auto 0; max-width:420px; font-size:13px; opacity:.55; line-height:1.45; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="note">—</div>
  <div id="freq">Play a note near your phone</div>
  <div id="status">Microphone not started</div>
  <button id="start">Start microphone</button>
  <div id="hint">The browser listens through the microphone and changes the screen color according to the detected musical note. For best results, play music through the phone speaker at moderate volume.</div>
</div>

<script>
let audioCtx, analyser, data, stream, running = false;
const noteEl = document.getElementById('note');
const freqEl = document.getElementById('freq');
const statusEl = document.getElementById('status');
const button = document.getElementById('start');

/* Chromatic note -> hue.
   C=0°, C#=30°, D=60° ... B=330° */
const noteNames = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];

function frequencyToMidi(f) {
  return 69 + 12 * Math.log2(f / 440);
}

function midiToFrequency(m) {
  return 440 * Math.pow(2, (m - 69) / 12);
}

function detectPitch(buffer, sampleRate) {
  // Autocorrelation pitch detector, tuned for typical musical frequencies.
  let SIZE = buffer.length;
  let rms = 0;
  for (let i=0;i<SIZE;i++) rms += buffer[i]*buffer[i];
  rms = Math.sqrt(rms/SIZE);
  if (rms < 0.012) return null;

  // Trim quiet ends.
  let start = 0, end = SIZE - 1;
  while (start < SIZE/2 && Math.abs(buffer[start]) < rms*0.5) start++;
  while (end > SIZE/2 && Math.abs(buffer[end]) < rms*0.5) end--;

  const minFreq = 65, maxFreq = 1000;
  const minLag = Math.floor(sampleRate/maxFreq);
  const maxLag = Math.min(Math.floor(sampleRate/minFreq), Math.floor(SIZE/2));

  let bestLag = -1, bestCorr = 0;
  for (let lag=minLag; lag<=maxLag; lag++) {
    let sum=0, norm1=0, norm2=0;
    for (let i=start; i+lag<=end; i++) {
      const a=buffer[i], b=buffer[i+lag];
      sum += a*b; norm1 += a*a; norm2 += b*b;
    }
    const corr = sum / Math.sqrt((norm1*norm2) || 1);
    if (corr > bestCorr) { bestCorr=corr; bestLag=lag; }
  }
  if (bestLag < 0 || bestCorr < 0.72) return null;

  // Parabolic interpolation around the correlation peak for better accuracy.
  let refined = bestLag;
  if (bestLag > minLag && bestLag < maxLag) {
    function corrAt(lag) {
      let sum=0,n1=0,n2=0;
      for(let i=start;i+lag<=end;i++){
        const a=buffer[i],b=buffer[i+lag];
        sum+=a*b;n1+=a*a;n2+=b*b;
      }
      return sum/Math.sqrt((n1*n2)||1);
    }
    const ym = corrAt(bestLag-1), y0 = corrAt(bestLag), yp = corrAt(bestLag+1);
    const denom = ym - 2*y0 + yp;
    if (Math.abs(denom)>1e-9) refined += 0.5*(ym-yp)/denom;
  }
  return sampleRate / refined;
}

function update() {
  if (!running) return;
  analyser.getFloatTimeDomainData(data);
  const freq = detectPitch(data, audioCtx.sampleRate);

  if (freq) {
    const midi = frequencyToMidi(freq);
    const nearest = Math.round(midi);
    const noteIndex = ((nearest % 12) + 12) % 12;
    const octave = Math.floor(nearest/12)-1;
    const note = noteNames[noteIndex];
    const cents = Math.round((midi-nearest)*100);

    // Map the 12 notes evenly around the color wheel.
    const hue = noteIndex * 30;
    const brightness = Math.min(100, 45 + Math.max(0, (cents ? 0 : 10)));
    document.body.style.background =
      `hsl(${hue} 85% ${brightness > 50 ? 50 : 44}%)`;

    noteEl.textContent = note + octave;
    freqEl.textContent = `${freq.toFixed(1)} Hz  •  ${cents >= 0 ? '+' : ''}${cents} cents`;
    statusEl.textContent = 'Listening';
  } else {
    statusEl.textContent = 'Listening — no clear musical pitch';
  }
  requestAnimationFrame(update);
}

button.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0.15;
    source.connect(analyser);
    data = new Float32Array(analyser.fftSize);

    running = true;
    button.classList.add('hidden');
    statusEl.textContent = 'Listening';
    update();
  } catch (err) {
    statusEl.textContent = 'Microphone permission is required.';
    console.error(err);
  }
});
</script>
</body>
</html>
