<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity Flow Visualizer</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#start{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:15px 30px;
    border:none;
    border-radius:20px;
    background:white;
    font-size:20px;
    cursor:pointer;
    z-index:10;
}

</style>
</head>
<body>

<button id="start">ENTER VISUALIZER</button>
<canvas id="c"></canvas>

<script>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

const particles = [];

for(let i=0;i<1200;i++){

    particles.push({
        angle:Math.random()*Math.PI*2,
        radius:Math.random()*600,
        speed:0.001 + Math.random()*0.005,
        offset:Math.random()*1000,
        size:Math.random()*3+1
    });

}

let startTime = Date.now();

function animate(){

    requestAnimationFrame(animate);

    const t = (Date.now()-startTime)*0.001;

    const hue = (t*30)%360;

    const bg = ctx.createRadialGradient(
        canvas.width/2,
        canvas.height/2,
        0,
        canvas.width/2,
        canvas.height/2,
        canvas.width
    );

    bg.addColorStop(0,
       `hsla(${hue},100%,50%,0.15)`);

    bg.addColorStop(0.4,
        `hsla(${(hue+120)%360},100%,30%,0.08)`);

    bg.addColorStop(1,
        "rgba(0,0,0,0.2)");

    ctx.fillStyle = bg;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const cx = canvas.width/2;
    const cy = canvas.height/2;

    for(let p of particles){

        p.angle += p.speed;

        const breathing =
            Math.sin(t+p.offset)*80;

        const r =
            p.radius +
            breathing;

        const x =
            cx +
            Math.cos(p.angle+t*0.2)*r;

        const y =
            cy +
            Math.sin(p.angle+t*0.2)*r;

        ctx.fillStyle=
        `hsla(${
            (hue+r*0.2)%360
        },100%,70%,0.85)`;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    for(let i=0;i<20;i++){

        const radius =
        50 +
        i*35 +
        Math.sin(t+i)*40;

        ctx.strokeStyle=
        `hsla(${
            (hue+i*12)%360
        },100%,70%,0.4)`;

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            radius,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    for(let i=0;i<80;i++){

        const angle =
            i*0.2 +
            t*0.3;

        const r =
            150+
            Math.sin(
                t*2+i*0.3
            )*100;

        const x =
            cx +
            Math.cos(angle)*r;

        const y =
            cy +
            Math.sin(angle)*r;

        ctx.strokeStyle=
        `hsla(${
            (hue+i*4)%360
        },100%,70%,0.25)`;

        ctx.beginPath();

        ctx.moveTo(cx,cy);

        ctx.lineTo(x,y);

        ctx.stroke();
    }

    const waveCount = 8;

    for(let w=0;w<waveCount;w++){

        ctx.beginPath();

        ctx.strokeStyle=
        `hsla(${
            (hue+w*40)%360
        },100%,75%,0.35)`;

        ctx.lineWidth=3;

        for(let x=0;
            x<canvas.width;
            x+=10){

            const y =
              canvas.height/2 +

              Math.sin(
                x*0.01 +
                t*2 +
                w
              )*80 +

              Math.sin(
                x*0.02 -
                t +
                w*2
              )*40;

            if(x===0)
                ctx.moveTo(x,y);
            else
                ctx.lineTo(x,y);
        }

        ctx.stroke();
    }
}

document
.getElementById("start")
.onclick = () => {

    document
    .getElementById("start")
    .style.display="none";

    document.body.requestFullscreen?.();

    animate();
};

</script>

</body>
</html>
